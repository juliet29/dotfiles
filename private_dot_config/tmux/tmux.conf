# config based on https://juliu.is/a-simple-tmux/


# ── Terminal / colors ──
# Prefer tmux-256color where its terminfo exists, else fall back (RHEL7 host).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# Advertise 24-bit (truecolor) RGB regardless of the outer terminal's TERM.
# (The old `terminal-overrides ",xterm-256color:RGB"` only fired when the outer
# TERM was exactly xterm-256color, so Ghostty/kitty/alacritty etc. lost truecolor.)
set -as terminal-features ",*:RGB"


set -g mouse on
set -g history-limit 102400
# set-clipboard on => tmux emits OSC 52, which kitty / kitten ssh forward to the
# host clipboard. No external copy-command: pbcopy is macOS-only and absent in
# this headless container, where it silently broke every copy.
set -g set-clipboard on

# Forward terminal focus events into tmux so apps inside it (Neovim) receive
# FocusGained/FocusLost — required for auto-reloading files changed on disk.
set -g focus-events on

# window management
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Manual window names only. `automatic-rename off` stops tmux from renaming a
# window to its running process; `allow-rename off` ignores rename escape
# sequences programs emit. A name you set (`prefix ,` / rename-window) sticks.
# Gated to Sherlock (see the persistence block below); elsewhere tabs keep
# auto-labeling by running command.
if-shell -b '[ -n "$SHERLOCK" ]' {
  setw -g automatic-rename off
  set -g allow-rename off
}


# key modes
# Use emacs keybindings in the status line
set-option -g status-keys emacs

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Fix ESC delay in vim
set -g escape-time 10


# Copy Mode
unbind-key -T copy-mode-vi v

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi 'C-v' \
  send-keys -X rectangle-toggle

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel


# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"


# Windows
# New window with the same path
bind t new-window -c '#{pane_current_path}'
# Better window splits
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'


# Break a pane into a new window
bind b break-pane -d

# Sherlock: re-enter the current allocation's container in every pane of this
# window, each returning to its own last dir (`alo cons -r`). Does NOT allocate;
# panes with no running job just error. Gated on the helper, which only exists on
# Sherlock, so this binds nowhere else.
if-shell '[ -x "$HOME/bin/alo-win" ]' 'bind R run-shell "$HOME/bin/alo-win"'
# TODO: navigation

# NOTE: This config previously loaded three tmux plugins — tmux-dotbar (status
# bar), tmux-resurrect + tmux-continuum (session save/restore) — bootstrapped by
# `tpack`. They were dropped on 2026-07-25 (no longer needed, and the plugin dir
# doesn't survive moth-recreate). To bring any back without tpack, add a
# .chezmoiexternal.toml entry cloning the repo into
# .config/tmux/plugins/<name>, then `run ~/.config/tmux/plugins/<name>/<name>.tmux`
# here (resurrect before continuum). Upstreams: vaaleyard/tmux-dotbar,
# tmux-plugins/tmux-resurrect, tmux-plugins/tmux-continuum.

# ── Sherlock persistence: tmuxp (declarative rebuild), NOT resurrect/continuum ──
# RETIRED tmux-resurrect + tmux-continuum. They autosaved every 15 min and
# restored on server start, but the restore was LOSSY: it replayed a saved pane
# geometry and dropped windows/panes that didn't fit the restoring terminal
# (this cost 7 of 9 windows on 2026-07-08). Since we only ever persist STRUCTURE
# (container shells are re-entered by hand via `prefix + R`, never persisted),
# a declarative rebuild is strictly better. Replacement, all on shared $HOME so
# it works from whatever login node the round-robin drops you on:
#   * ~/.config/tmuxp/*.yaml — the layout, rebuilt deterministically at the
#     current terminal size by `tmuxp-sync load` (see tc Case C).
#   * client-detached hook   — on detach (prefix d), refresh those YAMLs from
#     the live server via `tmuxp-sync save` (structure only; it strips the
#     container-entry ssh command so a rebuild can't replay a dead allocation).
#   * client-attached hook   — breadcrumb the server's login node to
#     ~/.cache/tmux/server-node so `tc` knows where to hop (Case B) without
#     parsing a resurrect snapshot.
# Gated to Sherlock only: $SHERLOCK is exported there (the same marker dot_zshrc
# keys off) and unset on the container / personal machines, so the node
# breadcrumb + tmuxp-save stay dormant wherever the tc/tmuxp workflow doesn't exist.
if-shell -b '[ -n "$SHERLOCK" ]' {
  set-hook -g client-attached 'run-shell -b "mkdir -p ~/.cache/tmux; hostname -s > ~/.cache/tmux/server-node 2>/dev/null"'
  set-hook -g client-detached 'run-shell -b "test -x $HOME/bin/tmuxp-sync && $HOME/bin/tmuxp-sync save -q"'
}
