# config based on https://juliu.is/a-simple-tmux/


# ── Terminal / colors ──
# Allow kitty graphics-protocol escapes to pass through tmux (icat, image.nvim).
set -g allow-passthrough on
# xterm-kitty terminfo is installed on this host, so programs inside tmux detect
# the real terminal's features.
set -g default-terminal "xterm-kitty"
# Advertise 24-bit (truecolor) RGB regardless of the outer terminal's TERM.
set -as terminal-features ",*:RGB"


# ── General behavior ──
set -g mouse on
set -g history-limit 102400
# OSC 52 clipboard: kitty / kitten ssh forward it to the host clipboard. No
# external copy-command (pbcopy is macOS-only, absent in this headless container).
set -g set-clipboard on
# Forward focus events so apps inside tmux (Neovim) auto-reload files changed on disk.
set -g focus-events on
# Fix ESC delay in vim
set -g escape-time 10


# ── Windows & panes ──
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Manual window names only: names set via `prefix ,` / rename-window stick.
# Gated to Sherlock; elsewhere tabs keep auto-labeling by running command.
if-shell -b '[ -n "$SHERLOCK" ]' {
  setw -g automatic-rename off
  set -g allow-rename off
}


# ── Key modes ──
# emacs in the status line, vim in copy mode
set-option -g status-keys emacs
setw -g mode-keys vi


# ── Copy mode ──
unbind-key -T copy-mode-vi v

bind-key -T copy-mode-vi v \
  send-keys -X begin-selection

bind-key -T copy-mode-vi 'C-v' \
  send-keys -X rectangle-toggle

bind-key -T copy-mode-vi y \
  send-keys -X copy-pipe-and-cancel

bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel


# ── Key bindings ──
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# New window with the same path
bind t new-window -c '#{pane_current_path}'
# Better window splits
bind '\' split-window -h -c '#{pane_current_path}'
bind - split-window -v -c '#{pane_current_path}'

# Break a pane into a new window
bind b break-pane -d

# Sherlock: re-enter the current allocation's container in every pane of this
# window, each returning to its own last dir (`alo cons -r`). Gated on the
# helper, which only exists on Sherlock, so this binds nowhere else.
if-shell '[ -x "$HOME/bin/alo-win" ]' 'bind R run-shell "$HOME/bin/alo-win"'


# ── Sherlock persistence: tmuxp declarative rebuild ──
# We persist STRUCTURE only (container shells are re-entered by hand via
# `prefix + R`). All on shared $HOME so it works from any round-robin login node.
#   * ~/.config/tmuxp/*.yaml — the layout, rebuilt at the current terminal size
#     by `tmuxp-sync load` (see tc Case C).
#   * client-detached hook   — refresh those YAMLs from the live server via
#     `tmuxp-sync save` (structure only; strips the container-entry ssh command).
#   * client-attached hook   — breadcrumb the server's login node to
#     ~/.cache/tmux/server-node so `tc` knows where to hop (Case B).
# Gated to Sherlock ($SHERLOCK), dormant on the container / personal machines.
if-shell -b '[ -n "$SHERLOCK" ]' {
  set-hook -g client-attached 'run-shell -b "mkdir -p ~/.cache/tmux; hostname -s > ~/.cache/tmux/server-node 2>/dev/null"'
  set-hook -g client-detached 'run-shell -b "test -x $HOME/bin/tmuxp-sync && $HOME/bin/tmuxp-sync save -q"'
}
